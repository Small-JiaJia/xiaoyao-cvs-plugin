{{extend defaultLayout}}
{{block 'css'}}
<style>
	.container {
		width: 620px !important;
		padding: 30px 0 18px 0;
		background-color: rgb(243, 242, 241);
		display: flex;
		flex-direction: column;
		align-items: center;
		overflow: hidden;
	}

	.qr-card {
		width: 546px;
		padding: 22px 22px 18px 22px;
		box-sizing: border-box;
		background: #fff;
		border-radius: 18px;
		box-shadow: 0 6px 22px rgba(29, 37, 64, 0.18);
		display: flex;
		flex-direction: column;
		align-items: center;
	}

	.qr-title {
		font-size: 1.3rem;
		font-weight: bold;
		color: #1d2540;
		letter-spacing: 2px;
		margin-bottom: 14px;
	}

	.qr-card svg {
		width: 500px;
		height: 500px;
		display: block;
	}

	.txt {
		width: 546px;
		box-sizing: border-box;
		text-align: center;
		color: #c0392b;
		font-size: 0.95rem;
		line-height: 1.65;
		margin-top: 16px;
		padding: 0 8px;
	}
</style>
{{/block}}
{{block 'main'}}
<div class="qr-card">
	<div class="qr-title">米游社扫码登录</div>
	{{each Qrsvg qr}}{{@ qr}}{{/each}}
</div>
<div class="txt">
	免责声明：请勿随意扫码，谁触发谁扫码，bot仅提供功能。<br />如果恶意抢码导致账号出问题的请自行承担后果
</div>
{{/block}}
